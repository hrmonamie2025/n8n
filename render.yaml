services:
  - type: web
    name: n8n
    env: docker
    repo: https://github.com/hrmonamie2025/n8n
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: N8N_BASIC_AUTH_ACTIVE
        value: 'true'
      - key: N8N_BASIC_AUTH_USER
        value: hrmonamie2025
      - key: N8N_BASIC_AUTH_PASSWORD
        value: 123456789Monamie$$$$$
      - key: N8N_ENCRYPTION_KEY
        value: 123456789Monamie$$$$$
      - key: WEBHOOK_URL
        value: https://n8n-sdz4.onrender.com
      - key: N8N_EDITOR_BASE_URL
        value: https://n8n-sdz4.onrender.com
      - key: N8N_HOST
        value: 0.0.0.0
      - key: N8N_PORT
        value: 10000
      - key: N8N_USER_FOLDER
        value: /opt/render/n8n
    disk:
      name: n8n-data
      mountPath: /opt/render/n8n
      sizeGB: 1
    plan
